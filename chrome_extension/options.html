<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
    <style>
        body {
            width: 430px;
            padding: 20px;
        }

        .glass-panel {
            padding: 30px;
        }

        label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: block;
        }

        .field-group {
            margin-bottom: 18px;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 5px;
            line-height: 1.45;
        }
    </style>
</head>

<body>
    <div class="glass-panel">
        <header>
            <h1>Hybrid Server Settings</h1>
            <p>Use your PC for YouTube and Render for X/Instagram.</p>
        </header>

        <div class="field-group">
            <label for="youtube-server-url">YouTube Server URL</label>
            <input type="text" id="youtube-server-url" placeholder="https://your-ngrok-url.ngrok-free.app">
            <div class="hint">Point this to your local server tunnel. This is the server the extension will use for YouTube links.</div>
        </div>

        <div class="field-group">
            <label for="social-server-url">X / Instagram Server URL</label>
            <input type="text" id="social-server-url" placeholder="https://youtube-mp3-server-g70t.onrender.com">
            <div class="hint">Point this to your Render deployment. This is the server the extension will use for X/Twitter and Instagram.</div>
        </div>

        <button id="save-btn">
            <span class="btn-text">Save Configuration</span>
        </button>

        <div id="status-message" class="status-message"></div>
    </div>
    <script src="options.js"></script>
</body>

</html>
